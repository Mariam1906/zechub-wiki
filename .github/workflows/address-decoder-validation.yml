name: Address Decoder Validation (temporary)
on:
  push:
    branches:
      - fix/address-decoder-nu63-guidance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://dummy.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy"
      SUPABASE_SERVICE_ROLE_KEY: "dummy"
      OPENAI_API_KEY: ""
      NEXT_TELEMETRY_DISABLED: "1"
      OWNER: "ZecHub"
      REPO: "zechub"
      BRANCH: "main"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts
      - name: Library unit tests (includes decoder classification)
        run: npx jest src/lib --ci --runInBand
      - name: Network helper tests
        run: npx jest --runTestsByPath "src/app/[locale]/tools/helper/__tests__/index.test.ts" --ci --runInBand
      - name: Generate Next.js type declarations
        run: npx next typegen
      - name: TypeScript typecheck
        run: npx tsc --noEmit --pretty false
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn build
      - name: Install Chromium
        run: yarn playwright install --with-deps chromium
      - name: Full browser regression suite (includes address decoder)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn playwright test --workers=1
      - name: Save browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decoder-validation-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
